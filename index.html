<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토닥토닥 대장간</title>
<meta property="og:title" content="토닥토닥 대장간">
<meta property="og:description" content="설치 없이 바로 하는 힐링 대장간 게임">
<meta property="og:image" content="https://todakforge.com/og.png">
<meta property="og:url" content="https://todakforge.com/">
<style>
  html, body { margin: 0; height: 100%; background: #120a06; color: #f3e6cf; font-family: sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; }
  a { color: #ff9a52; }
</style>
<script>
// 토닥토닥 대장간은 todakforge.com으로 옮겼어요. 이 주소에서 하던 진행(기기 ID와 저장)은 브라우저가 주소마다
// 따로 두기 때문에, 주소 뒤(#move=…)에 실어 새 주소로 넘긴다. 새 주소의 페이지가 받아서 처음 들어온 경우에만 쓴다.
(function () {
  var to = 'https://todakforge.com/' + location.search;
  try {
    var d = localStorage.getItem('hanjaru_device') || '';
    var s = localStorage.getItem('hanjaru_save') || '';
    if (d || s) to += '#move=' + encodeURIComponent(JSON.stringify({d: d, s: s}));
  } catch (e) {}
  location.replace(to);
})();
</script>
</head>
<body>
<main>
  <p>토닥토닥 대장간이 새 주소로 옮겼어요.</p>
  <p><a href="https://todakforge.com/">todakforge.com</a></p>
</main>
</body>
</html>
